<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises & Async/Await</title>
    
</head>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 800px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

button {
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    opacity: 0.8;
}

.status {
    margin-top: 25px;
    padding: 15px;
    background: #f1f1f1;
    border-radius: 8px;
}

.status strong {
    margin-left: 8px;
}

.output {
    margin-top: 20px;
}

.output h2 {
    margin-bottom: 10px;
}

pre {
    background: #18181b;
    color: white;
    padding: 20px;
    border-radius: 8px;
    min-height: 150px;
    white-space: pre-wrap;
}
</style>
<body>

    <div class="container">

        <h1>⚡ Async Dashboard</h1>
        <p class="subtitle">
            Promises & Async/Await Practice
        </p>

        <div class="buttons">

            <button id="chainBtn">
                Promise Chaining
            </button>

            <button id="allBtn">
                Promise.all()
            </button>

            <button id="settledBtn">
                Promise.allSettled()
            </button>

            <button id="raceBtn">
                Promise.race()
            </button>

            <button id="asyncBtn">
                Async / Await
            </button>

        </div>

        <div class="status">
            <span>Status:</span>
            <strong id="status">Ready</strong>
        </div>

        <div class="output">
            <h2>Result</h2>
            <pre id="output">Click a button...</pre>
        </div>

    </div>

    <script src="async.js"></script>
</body>
</html>
